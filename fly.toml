# Déploiement sur Fly.io : `fly launch --copy-config --no-deploy`, puis `fly deploy`.
# IMPORTANT : une seule machine. Les salles vivent en mémoire, plusieurs machines ne se verraient pas.
app = "wifidrop"            # à remplacer par un nom unique
primary_region = "cdg"      # Paris, la région la plus proche de l'Afrique de l'Ouest

[build]

[env]
  MODE = "public"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
